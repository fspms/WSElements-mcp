name: Test and Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Run linting
      run: |
        uv run ruff check withsecure_elements_mcp tests examples || echo "Linting completed with warnings"
        uv run mypy withsecure_elements_mcp || echo "Type checking completed with warnings"

    - name: Run tests
      run: |
        uv run pytest tests/ -v --cov=withsecure_elements_mcp --cov-report=xml || echo "No tests found, continuing..."

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Build Docker image
      run: |
        docker build -t withsecure-elements-mcp:test .

    - name: Test Docker image
      run: |
        docker run --rm withsecure-elements-mcp:test --help
